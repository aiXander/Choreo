[project]
name = "Choreo"
version = "0.1.0"
description = "User profile matching system using LLM embeddings and processing"
authors = [{name = "Xander", email = "xander@eden.art"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.0",
    "litellm>=1.76.2",
    "pyyaml>=6.0.2",
    "tqdm>=4.66.2",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.991",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true