[project]
name = "choreo"
version = "0.1.0"
description = "AI matchmaking toolkit — extract, embed, and directionally match free-text profiles"
authors = [{ name = "Xander Steenbrugge", email = "xander@eden.art" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    "openai>=1.30.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Plotting adapters (choreo.tsne, choreo.visualize_similarity,
# choreo.score_correlation) — not needed for the matching compute itself.
plots = [
    "matplotlib>=3.10.6",
    "seaborn>=0.13.0",
    "scikit-learn>=1.7.2",
    "adjustText>=1.3.0",
]

[dependency-groups]
# `uv sync` installs this by default: the full local dev experience
# (tests + the CLI's plotting steps). Downstream installs stay slim.
dev = [
    "pytest>=9.0.3",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.0",
    "scikit-learn>=1.7.2",
    "adjustText>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# choreo/defaults/*.yaml ships as package data automatically (hatchling
# includes every file inside the package directory).
packages = ["choreo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
