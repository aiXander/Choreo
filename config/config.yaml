# All models are routed through OpenRouter (https://openrouter.ai).
# Use OpenRouter model slugs (provider/model). Swap providers or run different
# phases on different models just by editing the strings below.
models:
  embedding: "google/gemini-embedding-2-preview"
  # Matryoshka (MRL) truncation, applied at computation time. gemini-embedding-2
  # is MRL-trained: the most important information is packed into the leading
  # dimensions, so the working vectors can be truncated to a shorter length with
  # minimal quality loss — cheaper similarity math. Full 3072-dim vectors are
  # always stored on disk, so this is re-tunable without re-embedding. Set to an
  # int (e.g. 1536, 768); leave null/omit to use the full native size (3072).
  embedding_dimensions: 1536
  extraction_llm: "google/gemini-3.5-flash"
  pair_llm: "google/gemini-3.5-flash"
  # Reasoning effort forwarded to OpenRouter via `reasoning: {effort}`. This is
  # the global default for every phase; pair scoring overrides it to "medium"
  # (see score.py) since that's the quality-critical step. OpenRouter ignores
  # the param on non-reasoning models, and reasoning models that can't be turned
  # off would otherwise default to "medium" (~50% of tokens) — so pinning "low"
  # (~20%) is the cost-effective, recommended baseline. Valid values:
  # xhigh | high | medium | low | minimal | none ("none" disables reasoning
  # where the provider supports it; null/omit lets the model pick its default).
  reasoning_effort: "low"

instruction_prompt:
  goal: "We are matching participants at an AI hackathon at Wintercircus Gent. Most attendees are here for professional reasons: to form teams and build product demos during the event (eg AI agents), while also making valuable professional connections. We want to surface pairs who should connect — where one person's skills fill another's build gap, and/or they share a project direction worth building together. Stay focused on the hackathon, but keep an eye slightly wider than the event itself: also surface connections with real potential beyond the weekend (career moves, co-founders, startups, business and network opportunities)."

budgets:
  extraction_llm_calls: 300
  max_pair_llm_calls: 1200
  max_n_llm_evaluations_per_profile: 24
  n_profiles_to_score_together: 5

hyde:
  n_descriptors: 1

recipe:
  instruction: "Score this match on collaboration potential. The primary signal is how directly each person's skills can address the other's project needs — the best matches are where both bring something the other needs, but strong one-directional signal is also valuable. Also reward a shared buildable direction or overlapping ambition (two people excited about the same problem who should team up), and connections with real potential beyond the hackathon (co-founder, startup, business, or network fit). Consider specificity — a vague overlap is less valuable than a concrete skill meeting a concrete need."
  section_weights:
    skills:   -0.10
    vision:   0.30
    project:  0.30
    needs:    -0.10
  cross_section_weights:
    needs_skills: 0.80

blending:
  embed_weight: 0.35
  llm_weight:   0.65

matching:
  b_min: 3
  b_max: 4
  min_profiles_required: 2

io:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  embeds_dir: "data/embeds"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache"
