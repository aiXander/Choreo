# All models are routed through OpenRouter (https://openrouter.ai).
# Use OpenRouter model slugs (provider/model). Swap providers or run different
# phases on different models just by editing the strings below.
models:
  embedding: "google/gemini-embedding-2-preview"
  # Matryoshka (MRL) truncation, applied at computation time. gemini-embedding-2
  # is MRL-trained: the most important information is packed into the leading
  # dimensions, so the working vectors can be truncated to a shorter length with
  # minimal quality loss — cheaper similarity math. Full 3072-dim vectors are
  # always stored on disk, so this is re-tunable without re-embedding. Set to an
  # int (e.g. 1536, 768); leave null/omit to use the full native size (3072).
  embedding_dimensions: 768
  extraction_llm: "google/gemini-3.1-flash-lite"
  pair_llm: "google/gemini-3.1-flash-lite"
  # Set true only when using reasoning-capable models, to forward the per-phase
  # reasoning effort (extraction/intro use "low", pair scoring uses "medium").
  # The default flash-lite model is not a reasoning model, so this stays false.
  enable_reasoning: false

instruction_prompt:
  goal: "We are matching community members who might potentially want to collaborate. Each person has specific skills and project needs. We want to find pairs where one person's skills can directly help the other's project needs."

budgets:
  extraction_llm_calls: 100
  max_pair_llm_calls: 300
  max_n_llm_evaluations_per_profile: 16
  n_profiles_to_score_together: 4

hyde:
  n_descriptors: 1

recipe:
  instruction: "Score this match based on how directly each person's skills can address the other's project needs. The best matches are where both people bring something the other needs but unidirectional matches are also totally fine. Consider specificity — a vague overlap is less valuable than a concrete skill meeting a concrete need."
  section_weights:
    skills:   -0.10
    vision:   0.30
    project:  0.10
    needs:    0.00
  cross_section_weights:
    needs_skills: 0.60

blending:
  embed_weight: 0.35
  llm_weight:   0.65

matching:
  b_min: 2
  b_max: 4
  min_profiles_required: 2

io:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  embeds_dir: "data/embeds"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache"
