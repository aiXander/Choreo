models:
  embedding: "text-embedding-3-large"
  extraction_llm: "gpt-5"
  pair_llm: "gpt-5"

instruction_prompt:
  goal: "We are building a social connectivity graph based on user profiles at the start of our art and tech residency. These people are professional artists, performers and technology builders. They do not know each other and so we are looking to create introductions and build relationships between them so they can start working on new projects together. We are looking to find matches that are aligned on interests and goals and have complementary skills and could lead to interesting, novel collaborations with open ended outcomes and emergent properties."

budgets:
  extraction_llm_calls: 100   # max = n_profiles (all sections extracted in same call)
  max_pair_llm_calls:   300   # small multiple of n_profiles
  max_n_llm_evaluations_per_profile: 16    # max number of LLM evaluations per profile
  n_profiles_to_score_together: 4          # number of profiles scored together (generates n*(n-1)/2 pairs per call)

recipe:
  instruction: "Score this match based on alignment and possible project complementarity: shared interests and goals but complementary skills that could build towards a real project collaboration."
  section_weights:          # Make sure these match the section names in section_prompt.yaml !!!
    capabilities: -0.20     # negative weight for inverse scoring (different = good)
    interests:     0.40
    goals:         0.30
    persona:       0.10

blending:  # final = w*embed + (1-w)*llm_score
  embed_weight: 0.35
  llm_weight:   0.65

matching:
  b_min: 3
  b_max: 4

io:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  embeds_dir: "data/embeds"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache"