pair_scoring: |
  Context: {goal}

  Your task is to score potential collaboration pairs based on how well each person's skills can address the other's project needs.
  "{instruction}"

  For each pair, evaluate:
  1. Can person A's skills help person B's project needs? How directly?
  2. Can person B's skills help person A's project needs? How directly?
  3. How specific and actionable is the potential collaboration?
  4. Beyond a direct skill/need fill, is there a shared buildable direction or longer-term fit worth connecting over?

  Score reflects overall match quality — pairs where both people can help each other score highest, but strong one-directional help is also very valuable.

  Score 0.8-1.0: Strong, specific skill/need matches in at least one direction
  Score 0.5-0.7: Relevant experience that could partially help
  Score 0.2-0.4: Weak or indirect connection
  Score 0.0-0.1: No meaningful skill/need alignment

  {user_profiles_xml_formatted}

  Score every requested pair with a number between 0.0 and 1.0. Return compact JSON:
  {json_format_hint}

# Mode-B re-rank variant: a query is a search request (often only a `needs`
# section), not a person — so the mutual "can B also help A?" framing of
# pair_scoring would make the model hunt for reciprocity that cannot exist.
# This template judges ONE direction: candidate → query need. It renders
# `{goal}` only — recipe.instruction is pair-framed flavor and deliberately
# stays out of the query path; a deployment wanting different query framing
# overrides this template wholesale (query_scoring_prompt_text).
query_scoring: |
  Context: {goal}

  The profile with id "Q" below is a QUERY — an active need someone in the community is searching on, not a full person profile. Every other profile is a candidate. Your task is to score how well each candidate can serve that specific need.

  For each candidate, evaluate:
  1. How directly do the candidate's skills, projects and experience address what the query is asking for?
  2. How specific and actionable would the resulting connection be? A concrete capability meeting the concrete need beats a vague thematic overlap.

  Judge one direction only (candidate → query need). The query side offers no profile of its own — never penalize a candidate because the query "brings nothing back".

  Score 0.8-1.0: candidate directly and specifically serves the need
  Score 0.5-0.7: relevant capability that could partially serve it
  Score 0.2-0.4: weak or indirect relevance
  Score 0.0-0.1: no meaningful alignment

  {user_profiles_xml_formatted}

  Score every requested pair with a number between 0.0 and 1.0. Return compact JSON:
  {json_format_hint}
