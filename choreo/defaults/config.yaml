# All models are routed through OpenRouter (https://openrouter.ai).
# Use OpenRouter model slugs (provider/model). Swap providers or run different
# phases on different models just by editing the strings below.
models:
  embedding: "google/gemini-embedding-2-preview"
  # Matryoshka (MRL) truncation, applied at computation time. gemini-embedding-2
  # is MRL-trained: the most important information is packed into the leading
  # dimensions, so the working vectors can be truncated to a shorter length with
  # minimal quality loss — cheaper similarity math. Full 3072-dim vectors are
  # always stored on disk, so this is re-tunable without re-embedding. Set to an
  # int (e.g. 1536, 768); leave null/omit to use the full native size (3072).
  embedding_dimensions: 1536
  extraction_llm: "minimax/minimax-m3"
  pair_llm: "minimax/minimax-m3"
  # Reasoning effort forwarded to OpenRouter via `reasoning: {effort}`. This is
  # the global default for every phase. OpenRouter ignores the param on
  # non-reasoning models, and reasoning models that can't be turned off would
  # otherwise default to "medium" (~50% of tokens) — so pinning "low" (~20%) is
  # the cost-effective, recommended baseline. Valid values:
  # xhigh | high | medium | low | minimal | none ("none" disables reasoning
  # where the provider supports it; null/omit lets the model pick its default).
  reasoning_effort: "low"
  # Effort for the quality-critical pair-scoring step (cohort scoring AND the
  # query re-rank) — overrides reasoning_effort for that phase only.
  pair_reasoning_effort: "low"

# The two deployment-flavor knobs. The prompt templates themselves are
# use-case-neutral by design — ALL deployment/community flavor belongs in
# `instruction_prompt.goal` (the context paragraph injected into every prompt)
# and `recipe.instruction` (the match-scoring emphasis). Override them per
# deployment via config layering; whole-prompt replacement
# (`prompts.<name>_prompt_text`) is the escape hatch for deeper changes.
instruction_prompt:
  goal: "We are matching people in a community whose skills, projects, and needs complement each other. We want to surface pairs who should connect — where one person's skills fill another's gap, and/or they share a project direction worth collaborating on. Focus on concrete, useful connections: a specific skill meeting a specific need, potential collaborations, and shared ambitions worth pursuing together."
  # Output language for the LLM-generated artifacts that get embedded
  # (extracted sections + HyDE descriptors). null = match each profile's own
  # language. For mixed-language communities pin ONE canonical language here
  # (e.g. "Dutch" or "English") so section embeddings stay comparable across
  # members — the raw profiles keep their original language either way.
  # NOTE: extraction reuse is keyed on profile content, so switching language
  # on an existing cohort needs --force to re-extract; HyDE picks it up
  # automatically (its cache key covers the prompt context).
  language: null

budgets:
  extraction_llm_calls: 300
  max_pair_llm_calls: 1600
  max_n_llm_evaluations_per_profile: 24
  n_profiles_to_score_together: 5

# Concurrency for every batched LLM phase (extraction, HyDE, pair scoring,
# query re-rank, introductions). This is the single knob that governs how many
# LLM HTTP requests are in flight at once across the whole pipeline. The
# dispatcher keeps exactly this many calls running and fires the next one the
# instant any one completes (semaphore-gated, not fire-a-batch-then-wait), so
# raising it shortens wall-clock at the cost of more concurrent load on the
# provider. Lower it if you hit rate limits.
concurrency:
  max_concurrent_llm_calls: 16

hyde:
  n_descriptors: 2

recipe:
  instruction: "Score this match on the value of connecting these two people. The primary signal is how directly each person's skills can address the other's project needs — the best matches are where both bring something the other needs, but strong one-directional signal is also valuable. Also reward a shared direction or overlapping ambition (two people excited about the same problem who should collaborate). Consider specificity — a vague overlap is less valuable than a concrete skill meeting a concrete need."
  section_weights:
    skills:   -0.10
    vision:   0.35
    project:  0.25
    needs:    -0.10
  cross_section_weights:
    needs_skills: 0.80

blending:
  embed_weight: 0.35
  llm_weight:   0.65

matching:
  b_min: 3
  b_max: 4
  min_profiles_required: 2
  # Subset batch mode (M members × N pool): optional degree cap for POOL-side
  # users so one popular person can't saturate every member's matches.
  # null = uncapped. Member-side degrees are bound by b_min/b_max as usual.
  pool_b_max: null
  # Novelty window for batch mode: pairs surfaced within the last N months are
  # excluded ("N novel matches"). Adapters apply this when building the
  # excluded_pairs input (FileStore reads match_history.jsonl; an external app
  # applies it to its own past_matches data). Older matches become eligible again.
  novelty_window_months: 6

# Mode B: query match (1 transient query × M pool candidates).
# Recipe note: there is deliberately NO packaged `query.recipe` — the
# recommended caller shape is an explicit section mapping (per-section query
# legs) plus a per-call `recipe_override` of same-section weights with empty
# cross weights, which embeds the legs directly (no extract LLM, no HyDE on
# the query path). Without an override, queries fall back to the top-level
# `recipe` (whose cross terms exist for batch mode and DO HyDE-expand the
# filled query sections) — fine for standalone use, not the hot path.
query:
  top_k: 4                     # shortlist size returned to the caller
  llm_rerank: true             # LLM re-rank (ON by default; false = pure-embedding, cheaper)
  # Over-fetch factor for the re-rank: the LLM scores top_k * this many
  # embedding candidates and the shortlist is the re-ranked top_k — so a good
  # match the embedding stage ranked just below the cut can be RECOVERED, not
  # merely reordered. 1 = legacy behavior (re-rank only reorders the top_k).
  # Recall pool = top_k * this = 4 * 4 = 16.
  rerank_pool_multiplier: 4
  generate_intros: true        # true = intro per shortlist row; an int N = only the top N; false = none

io:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  embeds_dir: "data/embeds"
  outputs_dir: "data/outputs"
  cache_dir: "data/cache"
